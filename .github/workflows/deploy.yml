name: Deploy Clippeak to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REMOTE_DIR: /srv/saas/clippeak

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add SSH key to agent
        uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -euo pipefail
          cd /srv/saas/clippeak || exit 1
          git fetch --all --prune
          git reset --hard origin/main
          npm ci
          rm -rf .output
          npm run build
          # Le build supprime .output : le bundle du worker doit etre reconstruit.
          npm run build:worker
          # Migrations : celles qui ne font qu'AJOUTER (colonnes, tables, index) sont appliquees ici, AVANT de redemarrer (l'ancien code
          # continue de fonctionner avec les nouvelles colonnes). Une migration qui supprime, renomme ou modifie des donnees arrete le
          # deploiement (code 4) : le site reste sur l'ancienne version, a toi de la relire et de l'appliquer (migrations.sh apply).
          # Code 2 = etat impossible a lire (on previent mais on ne bloque pas) ; tout autre code non nul = echec, on s'arrete.
          set +e
          bash scripts/ops/migrations.sh auto
          MIG=$?
          set -e
          if [ "$MIG" = "4" ]; then echo "::error::Migration a risque : relis-la puis applique-la (bash scripts/ops/migrations.sh apply) et relance le deploiement."; exit 1; fi
          if [ "$MIG" = "2" ]; then echo "::warning::Etat des migrations non verifie."; elif [ "$MIG" != "0" ]; then echo "::error::Echec de l'application des migrations."; exit 1; fi
          if pm2 describe clippeak > /dev/null 2>&1; then
            pm2 reload clippeak --update-env
          else
            pm2 start ecosystem.config.cjs
          fi
          # Worker de clips (utilisateur dedie) : recharge seulement s'il existe deja.
          if pm2 describe clippeak-worker > /dev/null 2>&1; then
            pm2 reload clippeak-worker
          fi
          EOF

      - name: Notifier Sassify Ops
        if: always()
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo SUCCESS || echo FAILED)
          curl -fsS -X POST "${{ secrets.OPS_URL }}/api/ingest/deploy" \
            -H "x-ops-key: ${{ secrets.OPS_INGEST_KEY }}" -H "content-type: application/json" \
            -d "$(jq -n --arg project "clippeak" --arg runId "${{ github.run_id }}" --arg status "$STATUS" \
              --arg commit "${{ github.sha }}" --arg message "$(git log -1 --pretty=%s | cut -c1-250)" \
              --arg branch "${{ github.ref_name }}" \
              --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{project:$project,runId:$runId,environment:"production",status:$status,commit:$commit,message:$message,branch:$branch,runUrl:$runUrl}')" || true
