name: Deploy Clippeak to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REMOTE_DIR: /srv/saas/clippeak

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add SSH key to agent
        uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -euo pipefail
          cd /srv/saas/clippeak || exit 1
          git fetch --all --prune
          git reset --hard origin/main
          npm ci
          rm -rf .output
          npm run build
          # Le build supprime .output : le bundle du worker doit etre reconstruit.
          npm run build:worker
          # Garde-fou : si une migration n'est pas appliquee a la base, on s'arrete AVANT de redemarrer (le site reste sur l'ancienne version).
          # Code 3 = migration en attente (bloque) ; 2 = etat impossible a lire (on previent mais on ne bloque pas).
          set +e
          bash scripts/ops/migrations.sh check
          MIG=$?
          set -e
          if [ "$MIG" = "3" ]; then echo "::error::Migration(s) non appliquee(s) : applique-les (bash scripts/ops/migrations.sh apply) puis relance le deploiement."; exit 1; fi
          if [ "$MIG" = "2" ]; then echo "::warning::Etat des migrations non verifie."; fi
          if pm2 describe clippeak > /dev/null 2>&1; then
            pm2 reload clippeak --update-env
          else
            pm2 start ecosystem.config.cjs
          fi
          # Worker de clips (utilisateur dedie) : recharge seulement s'il existe deja.
          if pm2 describe clippeak-worker > /dev/null 2>&1; then
            pm2 reload clippeak-worker
          fi
          EOF